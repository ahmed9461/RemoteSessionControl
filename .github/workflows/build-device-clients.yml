name: Build visible device clients

on:
  push:
    branches: [main]
    paths:
      - 'apps/device_client/**'
      - 'protocol/**'
      - 'core/**'
      - 'scripts/windows/**'
      - 'requirements.txt'
      - 'requirements-client.txt'
      - '.github/workflows/build-device-clients.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-clients-main
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RemoteSessionControl-Windows
          - os: macos-latest
            artifact: RemoteSessionControl-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-client.txt
      - run: pip install -r requirements-client.txt pyinstaller

      - name: Build lightweight Windows core client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name RemoteSessionControl-Client apps/device_client/main.py --paths . --exclude-module imageio_ffmpeg

      - name: Build macOS client with bundled recorder
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --onefile --name RemoteSessionControl-Client apps/device_client/main.py --paths . --hidden-import imageio_ffmpeg --collect-all imageio_ffmpeg

      - name: Extract Windows FFmpeg recording helper and self-test core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpeg = (python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())").Trim()
          if (-not (Test-Path $ffmpeg)) { throw "imageio-ffmpeg binary not found: $ffmpeg" }
          Copy-Item $ffmpeg dist\RemoteSessionControl-FFmpeg.exe
          $encoders = (& dist\RemoteSessionControl-FFmpeg.exe -hide_banner -encoders 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg helper self-test failed" }
          if ($encoders -notmatch 'libx264') { throw "FFmpeg helper does not provide libx264" }
          & dist\RemoteSessionControl-Client.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Windows core client self-test failed" }

      - name: Self-test macOS client
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/RemoteSessionControl-Client
          ./dist/RemoteSessionControl-Client --self-test

      - name: Validate PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $text = Get-Content scripts\windows\Start-RemoteSession.ps1 -Raw
          [void][scriptblock]::Create($text)

      - name: Build Windows portable runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --name RemoteSessionControl-Portable apps/device_client/main.py --paths . --exclude-module imageio_ffmpeg
          Copy-Item dist\RemoteSessionControl-FFmpeg.exe dist\RemoteSessionControl-Portable\RemoteSessionControl-FFmpeg.exe

      - name: Package Windows fallback methods
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clientHash = (Get-FileHash dist\RemoteSessionControl-Client.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $helperHash = (Get-FileHash dist\RemoteSessionControl-FFmpeg.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$clientHash  RemoteSessionControl-Client.exe" | Set-Content -Encoding ascii dist\RemoteSessionControl-Client.exe.sha256
          Copy-Item scripts\windows\Start-RemoteSession.ps1 dist\Start-RemoteSession.ps1
          Compress-Archive -Path dist\RemoteSessionControl-Portable\* -DestinationPath dist\RemoteSessionControl-Windows-Portable.zip -Force

          $portableHash = (Get-FileHash dist\RemoteSessionControl-Windows-Portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $launcherHash = (Get-FileHash dist\Start-RemoteSession.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = (Get-Content VERSION -Raw).Trim()
            source_sha = '${{ github.sha }}'
            generated_at_utc = [DateTime]::UtcNow.ToString('o')
            files = [ordered]@{
              'RemoteSessionControl-Client.exe' = [ordered]@{ sha256 = $clientHash }
              'RemoteSessionControl-FFmpeg.exe' = [ordered]@{ sha256 = $helperHash; purpose = 'lazy screen-recording encoder' }
              'RemoteSessionControl-Windows-Portable.zip' = [ordered]@{ sha256 = $portableHash }
              'Start-RemoteSession.ps1' = [ordered]@{ sha256 = $launcherHash }
            }
          } | ConvertTo-Json -Depth 5
          $manifest | Set-Content -Encoding utf8 dist\manifest.json

          New-Item -ItemType Directory -Force dist\windows-distribution | Out-Null
          Copy-Item dist\RemoteSessionControl-Client.exe dist\windows-distribution\
          Copy-Item dist\RemoteSessionControl-Client.exe.sha256 dist\windows-distribution\
          Copy-Item dist\RemoteSessionControl-FFmpeg.exe dist\windows-distribution\
          Copy-Item dist\RemoteSessionControl-Windows-Portable.zip dist\windows-distribution\
          Copy-Item dist\Start-RemoteSession.ps1 dist\windows-distribution\
          Copy-Item dist\manifest.json dist\windows-distribution\

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/RemoteSessionControl-Client*
          if-no-files-found: error

      - name: Upload PowerShell launcher
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSessionControl-PowerShell-Launcher
          path: dist/Start-RemoteSession.ps1
          if-no-files-found: error

      - name: Upload Windows portable runtime
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSessionControl-Windows-Portable
          path: dist/RemoteSessionControl-Windows-Portable.zip
          if-no-files-found: error

      - name: Upload complete Windows distribution bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSessionControl-Windows-Distribution
          path: dist/windows-distribution/*
          if-no-files-found: error
          retention-days: 90

  publish-development-distribution:
    name: Publish development Windows distribution
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RemoteSessionControl-Windows-Distribution
          path: dist/windows-distribution

      - name: Publish mutable development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            changed="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$latest_sha" --jq '.files[].filename' || true)"
            if printf '%s\n' "$changed" | grep -Eq '^(apps/device_client/|protocol/|core/|scripts/windows/|requirements\.txt$|requirements-client\.txt$|\.github/workflows/build-device-clients\.yml$)'; then
              echo "Skipping stale client build $GITHUB_SHA; relevant build inputs changed on main."
              exit 0
            fi
            echo "Main advanced only in non-client-build files; publishing client build $GITHUB_SHA."
          fi
          if gh release view client-dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload client-dev dist/windows-distribution/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit client-dev \
              --repo "$GITHUB_REPOSITORY" \
              --title "RemoteSessionControl Windows Client (development)" \
              --notes "Development client distribution built from $GITHUB_SHA. The lightweight core client lazy-loads the separately verified FFmpeg recorder only when video recording is requested."
          else
            gh release create client-dev dist/windows-distribution/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "RemoteSessionControl Windows Client (development)" \
              --notes "Development client distribution built from $GITHUB_SHA. The lightweight core client lazy-loads the separately verified FFmpeg recorder only when video recording is requested."
          fi
