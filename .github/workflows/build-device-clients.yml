name: Build visible device clients

on:
  push:
    branches: [main]
    paths:
      - 'apps/device_client/**'
      - 'protocol/**'
      - 'core/**'
      - 'scripts/windows/**'
      - 'requirements.txt'
      - '.github/workflows/build-device-clients.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RemoteSessionControl-Windows
          - os: macos-latest
            artifact: RemoteSessionControl-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pyinstaller

      - name: Build one-file client
        run: pyinstaller --onefile --name RemoteSessionControl-Client apps/device_client/main.py --paths . --collect-all imageio_ffmpeg

      - name: Validate PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $text = Get-Content scripts\windows\Start-RemoteSession.ps1 -Raw
          [void][scriptblock]::Create($text)

      - name: Build Windows portable runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onedir --name RemoteSessionControl-Portable apps/device_client/main.py --paths . --collect-all imageio_ffmpeg

      - name: Package Windows fallback methods
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\RemoteSessionControl-Client.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RemoteSessionControl-Client.exe" | Set-Content -Encoding ascii dist\RemoteSessionControl-Client.exe.sha256
          Copy-Item scripts\windows\Start-RemoteSession.ps1 dist\Start-RemoteSession.ps1
          Compress-Archive -Path dist\RemoteSessionControl-Portable\* -DestinationPath dist\RemoteSessionControl-Windows-Portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/RemoteSessionControl-Client*
          if-no-files-found: error

      - name: Upload PowerShell launcher
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSessionControl-PowerShell-Launcher
          path: dist/Start-RemoteSession.ps1
          if-no-files-found: error

      - name: Upload Windows portable runtime
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RemoteSessionControl-Windows-Portable
          path: dist/RemoteSessionControl-Windows-Portable.zip
          if-no-files-found: error
