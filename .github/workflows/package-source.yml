name: Package source ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Create source archive
        run: |
          zip -r RemoteSessionControl-source.zip . \
            -x '.git/*' '.env' '.venv/*' 'data/*' '__pycache__/*' '*.pyc' '.pytest_cache/*'
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteSessionControl-source
          path: RemoteSessionControl-source.zip
          if-no-files-found: error
          retention-days: 14
